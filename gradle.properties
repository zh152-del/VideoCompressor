# ============================================================================
# Gradle / Android 全局配置
# ============================================================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# 网络较慢时避免下载依赖超时（单位毫秒）
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
# 允许工程放在含中文等非 ASCII 字符的目录下（Windows 上常见）
android.overridePathCheck=true
# 本机 SDK 已是 36.1，AGP 8.9 会提示「尚未验证」，忽略即可
android.suppressUnsupportedCompileSdk=36
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false
# 禁止构建时自动联网下载 SDK 组件（本机已装好，联网下载反而会卡住）
android.builder.sdkDownload=false
